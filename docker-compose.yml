name: vamp

services:
  db:
    image: postgres:17-alpine
    container_name: vamp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vibe
      POSTGRES_PASSWORD: vibe
      POSTGRES_DB: vibe
    ports:
      # port 5432 is often taken by other services, so map to 5436 instead
      - '5436:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vibe -d vibe']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
    name: vamp-pgdata
